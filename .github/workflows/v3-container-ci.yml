name: V3 hosting integration checks
on:
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - "configs/**"
      - "Dockerfile"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "requirements-v4.txt"
      - "requirements-v4-dev.txt"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/v3-container-ci.yml"
  push:
    branches:
      - feat/v3-safe-hosted-integration
permissions:
  contents: read
jobs:
  v3_unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --no-cache-dir -r requirements-dev.txt
      - run: python -m pip install --no-cache-dir --no-deps -e .
      - name: Run frozen V3 and Legacy tests
        run: >-
          PYTHONPATH=src:. pytest -q
          tests/test_b1_soft_code.py
          tests/test_b2_capacity.py
          tests/test_hosted_session_cleanup.py
          tests/test_public_contracts.py
          tests/test_public_identity.py
          tests/test_public_payload.py
          tests/test_session_store.py
          tests/test_v3_api_behavior.py
          tests/test_v3_api_contract.py
          tests/test_v3_detector_worker.py
          tests/test_v3_pipeline.py
      - name: Confirm runtime Gradio version and dependency integrity
        run: |
          python -m pip check
          python -c "import gradio; assert gradio.__version__ == '6.31.0', gradio.__version__"
      - run: python -m compileall -q src app tests
      - run: git diff --check

  v4_unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      V3_SOURCE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --no-cache-dir -r requirements-v4-dev.txt
      - name: Install FFmpeg for real codec channel tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run V4 unit tests without private audio or model weights
        run: >-
          PYTHONPATH=src:. pytest -q
          tests/test_ci_workflow_contract.py
          tests/test_silentcipher_adapter.py
          tests/test_v4_gradio_compat.py
          tests/test_v4_p4_audio_processing.py
          tests/test_v4_p4_backends.py
          tests/test_v4_pcm16_peak_safety.py
      - name: Confirm V4 dependency integrity
        run: |
          python -m pip check
          python -c "import gradio; assert gradio.__version__ == '6.31.0', gradio.__version__"
      - run: python -m compileall -q src app tests
      - run: git diff --check

  docker:
    needs: v3_unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build V3-capable image
        run: docker build --tag blind-audio-v3:ci .
      - name: Check container identity and FFmpeg
        run: |
          docker run --rm --entrypoint /bin/sh blind-audio-v3:ci -c 'id && ffmpeg -version | head -n 1'
      - name: Start V3 in isolated container
        run: |
          docker run --rm -d --name blind-audio-v3-ci -p 127.0.0.1:8786:7860 \
            -e V3_DEMO_ENABLED=1 -e PORT=7860 blind-audio-v3:ci
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8786/ -o /tmp/v3-page.html; then exit 0; fi
            sleep 2
          done
          docker logs blind-audio-v3-ci
          exit 1
      - name: Gradio V3 HTTP integration check
        run: |
          python - <<'PY'
          import json, urllib.request
          cfg=json.load(urllib.request.urlopen('http://127.0.0.1:8786/config', timeout=30))
          rendered=str(cfg)
          assert 'V3 8-bit Soft-Code' in rendered, 'V3 mode not exposed'
          assert 'Legacy Course V2' in rendered, 'Legacy mode not exposed'
          print('V3+Legacy UI exposed in /config')
          PY
      - name: Container diagnostics
        if: always()
        run: |
          docker logs blind-audio-v3-ci || true
          docker rm -f blind-audio-v3-ci || true
