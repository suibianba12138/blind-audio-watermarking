[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsp-audio-watermark-course"
version = "1.0.0"
description = "Reference-assisted C2/C3 DSP audio watermarking course release"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
