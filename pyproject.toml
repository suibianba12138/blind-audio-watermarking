[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blind-audio-watermarking"
version = "0.1.0"
description = "Standalone public demo of a frozen blind audio watermarking baseline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
gui = [
  "gradio==6.31.0",
]
dev = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["audio_watermark*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
